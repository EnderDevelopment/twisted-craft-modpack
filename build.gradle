plugins {
    id 'net.minecraftforge.gradle' version '6.0.1'
}

group = 'com.enderdevelopment'
version = '1.0.0'
archivesBaseName = 'crazycraft'

repositories {
    mavenCentral()
    maven {
        name = 'forge'
        url = "https://files.minecraftforge.net/maven"
    }
}

ext.dependsOn('clean')

forge {
    version = project.minecraft_version
    runs {
        client {
            property 'forge.runs.client', 'true'
        }
        server {
            property 'forge.runs.server', 'true'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.loader_version}"
}